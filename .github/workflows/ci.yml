name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Offline + mock LLM: CI khong can va khong bao gio dung API key that.
      LLM_PROVIDER: mock
      LLM_MODEL: mock-model
      GX_ANALYTICS_ENABLED: "False"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.13 and dependencies
        run: uv sync --extra dev --python 3.13

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Run test suite with coverage gate
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=80
